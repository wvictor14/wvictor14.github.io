project:
  type: website
  render:
    - "*"
    - "!listing-templates/**"
  preview:
    host: 0.0.0.0
    port: 4210 # match devcontainer.json forwarded port
    browser: false # Optional: automatically open a browser
    navigate: false # Optional: automatically navigate the browser

brand: _brand.yml

website:
  title: "Victor Yuan"
  site-url: https://victoryuan.com
  description: "Victor's website"
  google-analytics: G-ZLSXEBDXV5
  navbar:
    search: true
    right:
      - text: Menu
        menu:
          - href: projects/index.qmd
            icon: puzzle-fill
            text: Projects
          - href: posts/index.qmd
            icon: book-fill
            text: Blog
          - href: collections/index.qmd
            icon: gem
            text: Collections
          - icon: rss
            href: posts/index.xml
            text: RSS
          - icon: github
            href: https://www.github.com/wvictor14
            text: GitHub
    tools:
      - icon: linkedin
        href: https://www.linkedin.com/in/victor2wy/
  body-footer: |
    <script data-goatcounter="https://victor2wy.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
  page-footer:
    border: true
    left: "&#169; 2026 Victor Yuan"
    center:
      - text: License
        href: license.qmd
    right: "made with [Quarto](https://quarto.org)"

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    highlight-style: highlight-styles/lavi.theme

execute:
  freeze: true